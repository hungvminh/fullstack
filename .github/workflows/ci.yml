name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gemini-compat-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Gemini compatibility tests
        run: npm run test:gemini-compat
